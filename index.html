<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Crushmetal</title>
    
    <!-- Les liens d'icônes seront remplis dynamiquement par le Javascript -->
    <link id="favicon" rel="icon" type="image/png" href="">
    <link id="appleicon" rel="apple-touch-icon" href="">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
        }
        
        #game-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background-color: #0f172a;
        }

        body.pc-mode #game-container {
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #thumb-zone {
            height: 80px;
            min-height: 80px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 20;
            cursor: crosshair; 
            border-top: 1px solid #333;
            padding-bottom: env(safe-area-inset-bottom); /* Gestion iPhone X+ */
        }

        body.pc-mode #thumb-zone {
            display: none;
        }

        .btn-menu {
            transition: all 0.1s;
            transform: skew(-10deg);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            pointer-events: auto; 
            user-select: none;
        }
        .btn-menu:active {
            transform: skew(-10deg) scale(0.95);
        }

        .hud-text { text-shadow: 1px 1px 0 #000; }
        
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .new-record {
            animation: flash 1s infinite;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Platform Indicator -->
        <div id="platformIndicator" class="absolute bottom-2 right-2 z-50 text-[10px] text-white/20 pointer-events-none uppercase tracking-widest">
            Chargement...
        </div>

        <!-- Audio Button -->
        <div class="absolute top-4 right-4 z-50">
            <button id="audioBtn" class="pointer-events-auto bg-slate-800/80 hover:bg-slate-700 p-2 rounded-full border border-white/20 transition-colors shadow-lg">
                <div class="relative w-6 h-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                    <div id="audioStrike" class="absolute top-0 left-0 w-full h-full flex items-center justify-center" style="display: flex;">
                        <div class="w-full h-0.5 bg-red-500 rotate-45 box-border border-y border-black"></div>
                    </div>
                </div>
            </button>
        </div>

        <!-- UI Overlay -->
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col p-4 z-10">
            
            <!-- HUD (In Game) -->
            <div id="hud" class="w-full h-full relative opacity-0 transition-opacity duration-500 pointer-events-none">
                
                <!-- Top Left: Score & Danger -->
                <div class="absolute top-0 left-0 text-left">
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest leading-none">Score</p>
                        <h1 id="scoreDisplay" class="text-3xl font-bold font-mono text-emerald-400 drop-shadow-lg leading-tight">0</h1>
                    </div>
                    <div class="mt-2">
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest leading-none">Mines</p>
                        <h1 id="mineDisplay" class="text-2xl font-bold font-mono text-red-500 drop-shadow-lg leading-tight">0<span class="text-sm text-slate-500" id="maxMinesDisplay">/20</span></h1>
                    </div>
                </div>

                <!-- Top Center: Time -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 text-center">
                    <div class="bg-slate-800/80 px-4 py-1 rounded-b-lg border-b border-x border-slate-600 backdrop-blur-sm">
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest leading-none mb-1">Temps</p>
                        <h1 id="timeDisplay" class="text-2xl font-bold font-mono text-slate-100">0s</h1>
                    </div>
                </div>

                <!-- Top Right: Record -->
                <div class="absolute top-14 right-0 text-right">
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest leading-none">Record (<span id="recordTypeLabel">...</span>)</p>
                    <h1 id="highScoreDisplay" class="text-3xl font-bold font-mono text-amber-400 drop-shadow-lg leading-tight">0</h1>
                </div>
            </div>

            <!-- GAME OVER SCREEN -->
            <div id="gameOverScreen" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-auto z-30 bg-black/80 backdrop-blur-sm hidden">
                <div class="text-center w-full max-w-sm px-6">
                    <h2 class="text-4xl font-black text-red-500 mb-2 tracking-tighter uppercase" style="font-family: 'Black Ops One', cursive;">FIN DE MISSION</h2>
                    
                    <div class="bg-slate-800 border-2 border-slate-600 rounded-xl p-6 mb-6 shadow-2xl">
                        <p class="text-slate-400 text-sm uppercase tracking-widest mb-1">Score Final</p>
                        <h1 id="finalScore" class="text-6xl font-mono font-bold text-white mb-4">0</h1>
                        
                        <div id="newRecordBadge" class="hidden new-record bg-amber-500 text-black font-bold px-3 py-1 rounded inline-block text-sm uppercase tracking-wider mb-2">
                            NOUVEAU RECORD !
                        </div>
                        <div id="noRecordBadge" class="text-slate-500 text-xs uppercase tracking-wide">
                            Record actuel: <span id="currentRecordDisplay">0</span>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        <button id="btnReplay" class="btn-menu w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xl border-l-4 border-emerald-400 shadow-lg shadow-emerald-900/50 uppercase">
                            REJOUER
                        </button>
                        
                        <button id="btnReturnMenu" class="btn-menu w-full py-4 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-lg border-l-4 border-slate-500 shadow-lg shadow-slate-900/50 uppercase">
                            RETOUR AU MENU
                        </button>
                    </div>
                </div>
            </div>

            <!-- Menu Screen -->
            <div id="menuScreen" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-auto transition-opacity duration-300 z-20">
                <div class="mt-[220px] flex flex-col gap-3 w-full max-w-xs px-6">
                    <button id="btnEasy" class="btn-menu w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xl border-l-4 border-emerald-400 shadow-lg shadow-emerald-900/50">
                        <div class="flex justify-between items-center px-2">
                            <span>FACILE</span>
                            <span class="text-xs bg-black/20 px-2 py-1 rounded record-badge" data-mode="easy">Record: 0</span>
                        </div>
                        <span class="block text-[10px] font-normal opacity-70 uppercase tracking-wider text-left px-2">Mines lentes (5s)</span>
                    </button>
                    
                    <button id="btnNormal" class="btn-menu w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-black text-xl border-l-4 border-blue-400 shadow-lg shadow-blue-900/50">
                        <div class="flex justify-between items-center px-2">
                            <span>NORMAL</span>
                            <span class="text-xs bg-black/20 px-2 py-1 rounded record-badge" data-mode="normal">Record: 0</span>
                        </div>
                        <span class="block text-[10px] font-normal opacity-70 uppercase tracking-wider text-left px-2">L'expérience originale</span>
                    </button>

                    <button id="btnHardcore" class="btn-menu w-full py-3 bg-red-600 hover:bg-red-500 text-white font-black text-xl border-l-4 border-red-400 shadow-lg shadow-red-900/50">
                        <div class="flex justify-between items-center px-2">
                            <span>HARDCORE</span>
                            <span class="text-xs bg-black/20 px-2 py-1 rounded record-badge" data-mode="hardcore">Record: 0</span>
                        </div>
                        <span class="block text-[10px] font-normal opacity-70 uppercase tracking-wider text-left px-2">Vitesses Variables</span>
                    </button>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="thumb-zone">
        <div class="flex items-center gap-2 opacity-30 pointer-events-none">
            <span>Zone de Contrôle</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /** GENERATION ICONE DYNAMIQUE **/
            function generateAppIcon() {
                // Création d'un canvas temporaire pour dessiner l'icône
                const iconCanvas = document.createElement('canvas');
                iconCanvas.width = 512;
                iconCanvas.height = 512;
                const ictx = iconCanvas.getContext('2d');

                // Fond bleu foncé (theme)
                ictx.fillStyle = '#0f172a';
                ictx.fillRect(0, 0, 512, 512);

                // Dessin du logo Elephant centré
                drawElephantLogo(ictx, 256, 256);

                // Conversion en image
                const iconUrl = iconCanvas.toDataURL('image/png');

                // Application aux balises meta
                document.getElementById('favicon').href = iconUrl;
                document.getElementById('appleicon').href = iconUrl;
            }

            /** PLATFORM DETECTION & CONFIGURATION **/
            const isMobile = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth < 1024;
            
            const CONFIG = {
                maxMines: isMobile ? 20 : 40,
                storagePrefix: isMobile ? 'crushmetal_hs_mobile_' : 'crushmetal_hs_pc_'
            };

            if (!isMobile) {
                document.body.classList.add('pc-mode');
                document.getElementById('platformIndicator').textContent = "MODE PC";
                document.getElementById('recordTypeLabel').textContent = "PC";
            } else {
                document.getElementById('platformIndicator').textContent = "MODE MOBILE";
                document.getElementById('recordTypeLabel').textContent = "MOBILE";
            }

            document.getElementById('maxMinesDisplay').textContent = '/' + CONFIG.maxMines;

            /** AUDIO ENGINE **/
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let audioCtx;
            let nextNoteTime = 0;
            let noteIndex = 0;
            let baseTempo = 128; 
            let currentTempo = baseTempo;
            let timerID;
            let totalMinesSpawned = 0;
            
            let soundEnabled = localStorage.getItem('crushmetal_sound') !== 'false'; 
            const strike = document.getElementById('audioStrike');
            strike.style.display = soundEnabled ? 'none' : 'flex';

            const bassPattern = [0, 0, 3, 3, 5, 5, 3, 0]; 
            
            function getFreq(note, octave) {
                const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const keyMap = {0:'C', 3:'D#', 5:'F', 7:'G', 10:'A#'};
                const n = keyMap[note] || 'C';
                const keyNumber = notes.indexOf(n);
                return 440 * Math.pow(2, ((octave - 4) * 12 + (keyNumber - 9)) / 12);
            }
            
            function playTone(freq, type, duration, time, vol=0.1, pan=0) {
                if (!soundEnabled || !audioCtx || freq <= 0) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const panner = audioCtx.createStereoPanner();
                    
                    osc.type = type;
                    osc.frequency.value = freq;
                    
                    osc.connect(gain);
                    gain.connect(panner);
                    panner.connect(audioCtx.destination);
                    
                    panner.pan.value = pan;
                    
                    const now = time;
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    
                    osc.start(now);
                    osc.stop(now + duration);
                } catch(e) {}
            }

            function playKick(time) {
                if (!soundEnabled || !audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.frequency.setValueAtTime(150, time);
                    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
                    
                    gain.gain.setValueAtTime(0.5, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
                    
                    osc.start(time);
                    osc.stop(time + 0.5);
                } catch(e) {}
            }

            function scheduler() {
                if(!soundEnabled) return; 
                
                while (nextNoteTime < audioCtx.currentTime + 0.1) {
                    const beat = noteIndex % 16; 
                    if (beat % 4 === 0) playKick(nextNoteTime);
                    if (beat % 2 !== 0) playTone(8000 + Math.random()*2000, 'triangle', 0.05, nextNoteTime, 0.05);

                    const bassNote = bassPattern[Math.floor(beat/2) % bassPattern.length];
                    playTone(getFreq(bassNote, 2), 'sawtooth', 0.15, nextNoteTime, 0.15);

                    const arpRoot = (Math.floor(noteIndex / 64) % 2 === 0) ? 0 : 5; 
                    const arpOctave = 4;
                    const interval = [0, 3, 7, 12][noteIndex % 4]; 
                    playTone(getFreq((arpRoot + interval)%12, arpOctave), 'square', 0.1, nextNoteTime, 0.05, (noteIndex%2===0?-0.3:0.3));

                    const secondsPerBeat = 60.0 / currentTempo / 4; 
                    nextNoteTime += secondsPerBeat;
                    noteIndex++;
                }
                timerID = window.setTimeout(scheduler, 25);
            }

            function initAudioContext() {
                if (!audioCtx) { try { audioCtx = new AudioContext(); } catch(e) { return; } }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            }

            function toggleAudio() {
                initAudioContext();
                soundEnabled = !soundEnabled;
                localStorage.setItem('crushmetal_sound', soundEnabled); 

                if (soundEnabled) {
                    strike.style.display = 'none';
                    if(audioCtx) {
                        nextNoteTime = audioCtx.currentTime + 0.1;
                        noteIndex = 0;
                        scheduler();
                    }
                } else {
                    strike.style.display = 'flex';
                    window.clearTimeout(timerID);
                }
            }
            document.getElementById('audioBtn').addEventListener('click', toggleAudio);


            /** GAME ENGINE **/
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const uiLayer = document.getElementById('ui-layer');
            const menuScreen = document.getElementById('menuScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const mineDisplay = document.getElementById('mineDisplay');
            const timeDisplay = document.getElementById('timeDisplay');
            const highScoreDisplay = document.getElementById('highScoreDisplay');

            function getHighScores() {
                return {
                    easy: localStorage.getItem(CONFIG.storagePrefix + 'easy') || 0,
                    normal: localStorage.getItem(CONFIG.storagePrefix + 'normal') || 0,
                    hardcore: localStorage.getItem(CONFIG.storagePrefix + 'hardcore') || 0
                };
            }
            let highScores = getHighScores();

            function updateMenuHighScores() {
                highScores = getHighScores(); 
                document.querySelectorAll('.record-badge').forEach(badge => {
                    const mode = badge.getAttribute('data-mode');
                    badge.textContent = `Record: ${highScores[mode]}`;
                });
            }
            updateMenuHighScores();

            const DIFFICULTIES = {
                easy: { goldSpawnRate: 2.5, mineSpawnRate: 5.0, baseMineSpeed: 40, speedVariance: false, playerSpeed: 290 },
                normal: { goldSpawnRate: 5.0, mineSpawnRate: 3.0, baseMineSpeed: 100, speedVariance: false, playerSpeed: 330 },
                hardcore: { goldSpawnRate: 5.0, mineSpawnRate: 3.0, baseMineSpeed: 100, speedVariance: true, playerSpeed: 330 }
            };

            let currentDifficulty = 'normal';
            let animationId;
            let lastTime = 0;
            let score = 0;
            let gameTime = 0;
            let isGameOver = true;
            let foodTimer = 0;
            let enemyTimer = 0;

            const player = { x: 0, y: 0, radius: 16, speed: 300, angle: 0 };
            let foods = [];
            let enemies = [];
            let particles = []; 
            const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false, w:false, s:false, a:false, d:false, z:false, q:false };

            function resize() {
                const container = document.getElementById('game-container');
                if(container.clientWidth > 0) {
                    canvas.width = container.clientWidth;
                    canvas.height = container.clientHeight;
                    if (isGameOver && gameOverScreen.classList.contains('hidden')) { 
                        drawMenuBackground(); 
                    }
                }
            }
            window.addEventListener('resize', resize);

            // --- DRAWING ---
            function drawElephantLogo(ctx, cx, cy) {
                ctx.save();
                ctx.translate(cx, cy);
                // Augmenter un peu la taille pour l'icône aussi
                const scale = Math.min(512, 512) / 600; // Référence 512 pour icône
                // Mais en jeu on utilise canvas width/height
                // On va utiliser une logique adaptative
                const isIconGen = ctx.canvas.width === 512; // Hack detection context icone
                const refSize = isIconGen ? 512 : Math.min(canvas.width, canvas.height);
                
                ctx.scale(refSize/600, refSize/600);

                ctx.beginPath(); ctx.moveTo(0, -120); ctx.lineTo(110, -70); ctx.lineTo(110, 60); ctx.lineTo(0, 130); ctx.lineTo(-110, 60); ctx.lineTo(-110, -70); ctx.closePath(); ctx.fillStyle = '#1e293b'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#475569'; ctx.stroke();
                ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(-60, -50); ctx.lineTo(-140, -90); ctx.lineTo(-130, 10); ctx.lineTo(-60, 40); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(60, -50); ctx.lineTo(140, -90); ctx.lineTo(130, 10); ctx.lineTo(60, 40); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.moveTo(-60, -60); ctx.lineTo(60, -60); ctx.lineTo(50, 40); ctx.lineTo(20, 90); ctx.lineTo(-20, 90); ctx.lineTo(-50, 40); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-20, 60); ctx.bezierCurveTo(-20, 130, 40, 130, 40, 80); ctx.lineTo(20, 80); ctx.bezierCurveTo(20, 110, 0, 110, 0, 60); ctx.fill();
                ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.moveTo(-30, 60); ctx.quadraticCurveTo(-50, 110, -90, 90); ctx.lineTo(-35, 50); ctx.fill(); ctx.beginPath(); ctx.moveTo(30, 60); ctx.quadraticCurveTo(50, 110, 90, 90); ctx.lineTo(35, 50); ctx.fill();
                ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(-40, -20); ctx.lineTo(-10, -10); ctx.lineTo(-40, 0); ctx.fill(); ctx.beginPath(); ctx.moveTo(40, -20); ctx.lineTo(10, -10); ctx.lineTo(40, 0); ctx.fill();
                
                // Texte uniquement si on n'est pas en train de générer la petite icône (sinon illisible)
                if(!isIconGen) {
                    ctx.font = '900 50px "Black Ops One", "Segoe UI", sans-serif'; 
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#fff';
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 10;
                    ctx.fillText("CRUSHMETAL GAME", 0, -150); 
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }

            function drawMenuBackground() {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Fond simple sans grille lourde
                ctx.fillStyle = '#1e293b';
                for(let i=0; i<50; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const s = Math.random() * 2;
                    ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.fill();
                }
                drawElephantLogo(ctx, canvas.width/2, canvas.height/2 - 50);
            }

            function startGame(difficulty) {
                initAudioContext();
                
                currentTempo = baseTempo;
                totalMinesSpawned = 0;

                if(soundEnabled) {
                    window.clearTimeout(timerID);
                    nextNoteTime = audioCtx.currentTime + 0.1;
                    noteIndex = 0;
                    scheduler();
                }

                currentDifficulty = difficulty;
                const settings = DIFFICULTIES[currentDifficulty];

                score = 0;
                gameTime = 0;
                foodTimer = 0; 
                enemyTimer = 0;
                player.speed = settings.playerSpeed;
                
                scoreDisplay.textContent = '0';
                mineDisplay.innerHTML = '1<span class="text-sm text-slate-500">/' + CONFIG.maxMines + '</span>';
                timeDisplay.textContent = '0s';
                highScoreDisplay.textContent = highScores[currentDifficulty];

                isGameOver = false;
                menuScreen.style.opacity = '0';
                gameOverScreen.classList.add('hidden'); 
                setTimeout(() => menuScreen.style.display = 'none', 300);
                document.getElementById('hud').style.opacity = '1';

                player.x = canvas.width / 2;
                player.y = canvas.height / 2;
                
                foods = [];
                enemies = [];
                particles = [];
                
                for(let i=0; i<3; i++) spawnFood();
                spawnEnemy();

                lastTime = performance.now();
                if(animationId) cancelAnimationFrame(animationId);
                gameLoop(lastTime);
            }

            function returnToMenu() {
                gameOverScreen.classList.add('hidden');
                menuScreen.style.display = 'flex';
                setTimeout(() => {
                    menuScreen.style.opacity = '1';
                    drawMenuBackground();
                }, 50);
            }

            function gameOver() {
                isGameOver = true;
                document.getElementById('hud').style.opacity = '0';
                window.clearTimeout(timerID); 
                
                let isNewRecord = false;
                const currentRec = highScores[currentDifficulty];
                
                if (score > currentRec) {
                    highScores[currentDifficulty] = score;
                    localStorage.setItem(CONFIG.storagePrefix + currentDifficulty, score);
                    updateMenuHighScores();
                    isNewRecord = true;
                }

                document.getElementById('finalScore').textContent = score;
                document.getElementById('currentRecordDisplay').textContent = highScores[currentDifficulty];
                
                if (isNewRecord) {
                    document.getElementById('newRecordBadge').classList.remove('hidden');
                    document.getElementById('noRecordBadge').classList.add('hidden');
                } else {
                    document.getElementById('newRecordBadge').classList.add('hidden');
                    document.getElementById('noRecordBadge').classList.remove('hidden');
                }

                gameOverScreen.classList.remove('hidden');
            }

            function spawnFood() {
                if (foods.length >= 5) return;
                const margin = 50;
                const minDistance = 100;
                let fx, fy, valid = false, attempts = 0;
                while(!valid && attempts < 10) {
                    fx = margin + Math.random() * (canvas.width - margin * 2);
                    fy = margin + Math.random() * (canvas.height - margin * 2);
                    valid = true;
                    for(let f of foods) if(Math.hypot(fx-f.x, fy-f.y) < minDistance) valid = false;
                    attempts++;
                }
                foods.push({ x: fx, y: fy, radius: 8, vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220, color: '#fbbf24' });
            }

            function spawnEnemy() {
                if(enemies.length >= CONFIG.maxMines) return;

                totalMinesSpawned++;
                if (totalMinesSpawned % 10 === 0) {
                    currentTempo += 10; 
                }

                const settings = DIFFICULTIES[currentDifficulty];
                const margin = 20;
                let ex, ey, attempts = 0;
                const safeZone = 200;
                do {
                    ex = margin + Math.random() * (canvas.width - margin * 2);
                    ey = margin + Math.random() * (canvas.height - margin * 2);
                    attempts++;
                } while(Math.hypot(ex - player.x, ey - player.y) < safeZone && attempts < 10);

                let speed = settings.baseMineSpeed * (1 + (gameTime * 0.01));
                let color = '#ef4444';

                if (settings.speedVariance) {
                    const rand = Math.random();
                    if (rand < 0.33) { speed *= 0.5; color = '#991b1b'; }
                    else if (rand < 0.66) { speed *= 1.0; }
                    else { speed *= 1.6; color = '#fca5a5'; }
                }

                enemies.push({ x: ex, y: ey, radius: 12, vx: (Math.random() < 0.5 ? -1 : 1) * speed, vy: (Math.random() < 0.5 ? -1 : 1) * speed, color: color });
                mineDisplay.innerHTML = `${enemies.length}<span class="text-sm text-slate-500">/${CONFIG.maxMines}</span>`;
            }

            function createParticles(x, y, color) {
                for(let i=0; i<8; i++) {
                    particles.push({ x: x, y: y, vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300, life: 1, color: color });
                }
            }

            function update(dt) {
                const settings = DIFFICULTIES[currentDifficulty];
                gameTime += dt;
                timeDisplay.textContent = Math.floor(gameTime) + 's';

                if (foods.length === 0) spawnFood();

                foodTimer += dt;
                if (foodTimer >= settings.goldSpawnRate) {
                    spawnFood();
                    foodTimer = 0;
                }

                enemyTimer += dt;
                if (enemyTimer >= settings.mineSpawnRate) {
                    spawnEnemy();
                    enemyTimer = 0;
                    if(enemies.length < CONFIG.maxMines) {
                        uiLayer.style.boxShadow = "inset 0 0 20px rgba(239, 68, 68, 0.2)";
                        setTimeout(() => uiLayer.style.boxShadow = "none", 200);
                    }
                }

                let moveX = 0, moveY = 0;
                if (keys.ArrowUp || keys.z || keys.w) moveY = -1;
                if (keys.ArrowDown || keys.s) moveY = 1;
                if (keys.ArrowLeft || keys.q || keys.a) moveX = -1;
                if (keys.ArrowRight || keys.d) moveX = 1;

                if (touchInput.active) {
                    const dx = touchInput.x - touchInput.originX;
                    const dy = touchInput.y - touchInput.originY;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 10) { moveX = dx/dist; moveY = dy/dist; }
                }

                if (moveX || moveY) {
                    if (!touchInput.active) {
                        const len = Math.hypot(moveX, moveY);
                        if(len>0) { moveX/=len; moveY/=len; }
                    }
                    player.x += moveX * player.speed * dt;
                    player.y += moveY * player.speed * dt;
                    if(moveX < -0.1) player.angle = Math.PI; else if(moveX > 0.1) player.angle = 0;
                }

                player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

                for (let i = foods.length - 1; i >= 0; i--) {
                    let f = foods[i];
                    f.x += f.vx * dt; f.y += f.vy * dt;
                    
                    if (f.x < f.radius) { f.x = f.radius; f.vx *= -1; }
                    else if (f.x > canvas.width - f.radius) { f.x = canvas.width - f.radius; f.vx *= -1; }
                    
                    if (f.y < f.radius) { f.y = f.radius; f.vy *= -1; }
                    else if (f.y > canvas.height - f.radius) { f.y = canvas.height - f.radius; f.vy *= -1; }

                    if (Math.hypot(player.x - f.x, player.y - f.y) < player.radius + f.radius) {
                        score++;
                        scoreDisplay.textContent = score;
                        createParticles(f.x, f.y, f.color);
                        foods.splice(i, 1);
                    }
                }

                for (let e of enemies) {
                    e.x += e.vx * dt; e.y += e.vy * dt;
                    
                    if (e.x < e.radius) { e.x = e.radius; e.vx *= -1; }
                    else if (e.x > canvas.width - e.radius) { e.x = canvas.width - e.radius; e.vx *= -1; }
                    
                    if (e.y < e.radius) { e.y = e.radius; e.vy *= -1; }
                    else if (e.y > canvas.height - e.radius) { e.y = canvas.height - e.radius; e.vy *= -1; }

                    if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius - 4) {
                        createParticles(player.x, player.y, '#ffdbac');
                        gameOver();
                        return;
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx * dt;
                    particles[i].y += particles[i].vy * dt;
                    particles[i].life -= dt * 2;
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
            }

            function drawSailor(ctx, x, y, radius, angle) {
                ctx.save();
                ctx.translate(x, y);
                if (Math.abs(angle) > Math.PI / 2) { ctx.scale(-1, 1); }
                const s = radius / 16;
                ctx.scale(s, s);

                // Ombre
                ctx.beginPath(); ctx.ellipse(0, 14, 10, 3, 0, 0, Math.PI*2); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
                
                // Corps & Tête
                ctx.fillStyle = '#f5d0b0'; ctx.fillRect(-6, 0, 12, 14); // Cou
                ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.moveTo(-10, 16); ctx.quadraticCurveTo(0, 8, 10, 16); ctx.lineTo(12, 16); ctx.lineTo(0, 16); ctx.fill(); // Col
                ctx.fillStyle = '#f5d0b0'; ctx.beginPath(); ctx.arc(0, -2, 12, 0, Math.PI * 2); ctx.fill(); // Tête
                
                // Visage Rasé
                ctx.strokeStyle = '#eebfa1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(3, 0); ctx.stroke();
                
                // YEUX (Grands & Visibles)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(3.5, -4, 3, 0, Math.PI*2);
                ctx.arc(-3.5, -4, 3, 0, Math.PI*2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(3.5, -4, 1.5, 0, Math.PI*2);
                ctx.arc(-3.5, -4, 1.5, 0, Math.PI*2);
                ctx.fill();
                
                // BACHI (Chapeau Bagad de Lann-Bihoué)
                // Base blanche
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); 
                ctx.arc(0, -6, 12, Math.PI, 0); 
                ctx.lineTo(12, -2); 
                ctx.lineTo(-12, -2); 
                ctx.fill();
                
                // Bande bleue
                ctx.fillStyle = '#1e3a8a'; 
                ctx.fillRect(-12, -2, 24, 4);

                // Pompon rouge
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(0, -14, 4, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }

            function draw() {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let f of foods) {
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2);
                    ctx.fillStyle = f.color; ctx.fill();
                }
                for (let e of enemies) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
                    ctx.fillStyle = e.color; ctx.fill();
                    ctx.strokeStyle = e.color; ctx.lineWidth = 2;
                    for(let i=0; i<8; i++) {
                        const ang = (Math.PI*2/8)*i + gameTime*2;
                        const px = e.x + Math.cos(ang)*(e.radius+4);
                        const py = e.y + Math.sin(ang)*(e.radius+4);
                        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(px, py); ctx.stroke();
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(e.x-3, e.y-3, 4, 0, Math.PI*2); ctx.fill();
                }
                drawSailor(ctx, player.x, player.y, player.radius, player.angle);
                for (let p of particles) {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            function gameLoop(timestamp) {
                if (isGameOver) return;
                const dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                update(Math.min(dt, 0.1));
                draw();
                animationId = requestAnimationFrame(gameLoop);
            }

            window.addEventListener('keydown', e => {
                if(keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key] = true;
                if(e.key.length===1) keys[e.key.toLowerCase()] = true;
            });
            window.addEventListener('keyup', e => {
                if(keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key] = false;
                if(e.key.length===1) keys[e.key.toLowerCase()] = false;
            });

            const touchInput = { active: false, originX: 0, originY: 0, x: 0, y: 0 };
            
            document.body.addEventListener('touchstart', e => {
                if(e.target.closest('.btn-menu') || e.target.closest('#audioBtn')) return;
                e.preventDefault();
                const touch = e.touches[0];
                touchInput.active = true;
                touchInput.originX = touch.clientX;
                touchInput.originY = touch.clientY;
                touchInput.x = touch.clientX;
                touchInput.y = touch.clientY;
            }, {passive: false});

            document.body.addEventListener('touchmove', e => {
                if(!touchInput.active) return;
                e.preventDefault();
                const touch = e.touches[0];
                touchInput.x = touch.clientX;
                touchInput.y = touch.clientY;
            }, {passive: false});

            document.body.addEventListener('touchend', () => { touchInput.active = false; });
            
            document.getElementById('btnEasy').addEventListener('click', function() { startGame('easy'); });
            document.getElementById('btnNormal').addEventListener('click', function() { startGame('normal'); });
            document.getElementById('btnHardcore').addEventListener('click', function() { startGame('hardcore'); });
            document.getElementById('btnReplay').addEventListener('click', function() { startGame(currentDifficulty); });
            document.getElementById('btnReturnMenu').addEventListener('click', returnToMenu);

            // Generation Icone au lancement
            generateAppIcon();

            resize();
            setTimeout(drawMenuBackground, 100);
        });
    </script>
</body>
